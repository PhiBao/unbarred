name: Keep Supabase alive

on:
  schedule:
    # Daily at 03:17 UTC. Supabase free projects pause after a week without
    # database activity; this query keeps the project active.
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Query the database
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          if [ -z "$SUPABASE_DB_URL" ]; then
            echo "SUPABASE_DB_URL is not set. Add it under Settings → Secrets and variables → Actions."
            exit 1
          fi
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client >/dev/null
          psql "$SUPABASE_DB_URL" -v ON_ERROR_STOP=1 -c "select now() as checked_at, 1 as ok;"

      - name: Check the live app
        run: curl -fsS --max-time 30 https://unbarred.fly.dev/home > /dev/null
